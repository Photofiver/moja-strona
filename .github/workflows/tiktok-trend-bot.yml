name: TikTok Animal Viral Remix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tiktok-bot/.trigger"

permissions:
  contents: write
  issues: write

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install free tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -r tiktok-bot/requirements.txt

      - name: Cache speech model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-tiny-v1

      - name: Find English viral and write original reenactment
        run: python tiktok-bot/trend_bot.py

      - name: Generate original cinematic AI reenactment
        run: python tiktok-bot/animate.py

      - name: Save hourly trend state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tiktok-bot/state.json
          git diff --cached --quiet || (git commit -m "Update TikTok hourly trend state" && git push)

      - name: Publish latest video
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view tiktok-latest --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create tiktok-latest --repo "${{ github.repository }}" --title "TikTok latest" --notes "Latest AI animal remix"
          gh release upload tiktok-latest tiktok-bot/output/tiktok_ready.mp4 tiktok-bot/output/caption.txt tiktok-bot/output/trend.json \
            --repo "${{ github.repository }}" --clobber

      - name: Notify phone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SOURCE="$(python -c 'import json; d=json.load(open("tiktok-bot/output/trend.json")); print(d["source_url"])')"
          VIEWS="$(python -c 'import json; d=json.load(open("tiktok-bot/output/trend.json")); print(d["play_count"])')"
          DELTA="$(python -c 'import json; d=json.load(open("tiktok-bot/output/trend.json")); print(d["hourly_view_delta"])')"
          MODE="$(python -c 'import json; d=json.load(open("tiktok-bot/output/trend.json")); print(d["selection_mode"])')"
          URL="https://github.com/${{ github.repository }}/releases/download/tiktok-latest/tiktok_ready.mp4"
          printf '@Photofiver\n\n## GOTOWA ORYGINALNA PRZERÓBKA AI\n\nŹródłowy viral: %s\n\nWyświetlenia: %s\nPrzyrost od poprzedniego skanu: %s\nTryb wyboru: %s\n\n**GOTOWY MP4:** %s\n' "$SOURCE" "$VIEWS" "$DELTA" "$MODE" "$URL" > /tmp/comment.md
          gh issue comment 1 --repo "${{ github.repository }}" --body-file /tmp/comment.md
