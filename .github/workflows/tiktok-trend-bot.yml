name: TikTok Animal Trend Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tiktok-bot/.trigger"

permissions:
  contents: write
  issues: write

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TIKTOK_MS_TOKEN: ${{ secrets.TIKTOK_MS_TOKEN }}
      TIKTOK_TEST_MODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install free tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg xvfb fonts-dejavu-core
          pip install -r tiktok-bot/requirements.txt
          python -m playwright install chromium

      - name: Read TikTok trend
        run: xvfb-run -a python tiktok-bot/trend_bot.py

      - name: Human Polish voice
        run: |
          TEXT="$(cat tiktok-bot/output/narration.txt)"
          edge-tts --voice pl-PL-MarekNeural --text "$TEXT" --write-media tiktok-bot/output/voice.mp3
          ffmpeg -y -i tiktok-bot/output/voice.mp3 -ar 44100 -ac 1 tiktok-bot/output/voice.wav

      - name: Animate talking animal
        run: python tiktok-bot/animate.py

      - name: Publish latest video
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view tiktok-latest --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create tiktok-latest --repo "${{ github.repository }}" --title "TikTok latest" --notes "Latest ready-to-post original animal trend video"
          gh release upload tiktok-latest tiktok-bot/output/tiktok_ready.mp4 tiktok-bot/output/caption.txt tiktok-bot/output/trend.json \
            --repo "${{ github.repository }}" --clobber

      - name: Notify phone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TOPIC="$(python -c 'import json; d=json.load(open("tiktok-bot/output/trend.json")); print(d.get("topic","trend"))')"
          TYPE="$(python -c 'import json; d=json.load(open("tiktok-bot/output/trend.json")); print("TESTOWY FILM" if d.get("type")=="test" else ("POPULARNY FILM TIKTOK" if d.get("type")=="video" else "TREND TIKTOK"))')"
          SOURCE="$(python -c 'import json; d=json.load(open("tiktok-bot/output/trend.json")); print(d.get("source_url",""))')"
          CAPTION="$(cat tiktok-bot/output/caption.txt)"
          URL="https://github.com/${{ github.repository }}/releases/download/tiktok-latest/tiktok_ready.mp4"
          printf '@Photofiver\n\n## GOTOWY FILM ZE ZWIERZAKIEM\n\n**%s**\n\nTemat: **%s**\n\nOryginalny trend: %s\n\n**GOTOWY MP4:** %s\n\n**Opis:**\n%s\n' "$TYPE" "$TOPIC" "$SOURCE" "$URL" "$CAPTION" > /tmp/comment.md
          gh issue comment 1 --repo "${{ github.repository }}" --body-file /tmp/comment.md
