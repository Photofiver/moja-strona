name: Cosmonaut multi BEEP demo

on:
  push:
    paths:
      - ".github/workflows/cosmonaut_multi_beep.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download source
        run: |
          curl -L --fail --retry 3             "https://archive.org/download/thecosmonaut-s125/01106_BO6J1609.mp4"             -o source.mp4

      - name: Build clips
        run: |
          make_clip () {
            START="$1"
            DUR="$2"
            MUTE="$3"
            OUT="$4"
            ffmpeg -y -i source.mp4               -f lavfi -t "$DUR" -i "sine=frequency=1000:sample_rate=44100"               -filter_complex "[0:v]trim=start=$START:duration=$DUR,setpts=PTS-STARTPTS,split=2[bg][fg];[bg]scale=720:1280:force_original_aspect_ratio=increase,crop=720:1280,boxblur=14:2[bg2];[fg]scale=720:-2[fg2];[bg2][fg2]overlay=(W-w)/2:(H-h)/2,drawtext=text='REAL DIALOGUE + FAKE BEEP':fontcolor=white:fontsize=34:x=(w-text_w)/2:y=70:box=1:boxcolor=black@0.50:boxborderw=14,drawtext=text='The Cosmonaut raw footage / CC BY-SA-NC 3.0':fontcolor=white:fontsize=20:x=(w-text_w)/2:y=h-50:box=1:boxcolor=black@0.45:boxborderw=8,fps=30[v];[0:a]atrim=start=$START:duration=$DUR,asetpts=PTS-STARTPTS,volume='if($MUTE,0,1)':eval=frame[a0];[1:a]volume='if($MUTE,0.52,0)':eval=frame[beep];[a0][beep]amix=inputs=2:duration=first:normalize=0[a]"               -map "[v]" -map "[a]"               -c:v libx264 -preset veryfast -crf 22 -pix_fmt yuv420p               -c:a aac -b:a 160k -ar 44100               "$OUT"
          }

          make_clip 46.90 1.70 "between(t,0.61,1.39)" c1.mp4
          make_clip 79.65 1.40 "between(t,0.56,0.78)" c2.mp4
          make_clip 98.20 1.00 "between(t,0.38,0.78)" c3.mp4
          make_clip 105.95 1.10 "between(t,0.36,0.90)" c4.mp4
          make_clip 152.40 4.30 "between(t,0.50,1.26)+between(t,3.49,3.89)" c5.mp4
          make_clip 181.35 1.80 "between(t,1.21,1.61)" c6.mp4

          printf "file 'c1.mp4'\nfile 'c2.mp4'\nfile 'c3.mp4'\nfile 'c4.mp4'\nfile 'c5.mp4'\nfile 'c6.mp4'\n" > clips.txt
          ffmpeg -y -f concat -safe 0 -i clips.txt -c copy cosmonaut_multi_beep_demo.mp4

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: cosmonaut-multi-beep-demo
          path: cosmonaut_multi_beep_demo.mp4
          retention-days: 7
