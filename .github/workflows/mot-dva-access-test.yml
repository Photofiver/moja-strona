name: MOT DVA access test (isolated)
on:
  push:
    branches:
      - mot-availability-probe-20261010
    paths:
      - .github/workflows/mot-dva-access-test.yml
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public MOT booking endpoint without bypassing restrictions
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, html
          from html.parser import HTMLParser
          class Title(HTMLParser):
              def __init__(self):
                  super().__init__(); self.intitle = False; self.title = ""
              def handle_starttag(self, tag, attrs):
                  if tag == "title": self.intitle = True
              def handle_endtag(self, tag):
                  if tag == "title": self.intitle = False
              def handle_data(self, data):
                  if self.intitle: self.title += data
          for url in ("https://www.nidirect.gov.uk/services/book-your-mot-vehicle-test-online","https://dva-bookings.nidirect.gov.uk/"):
              print("URL:",url)
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 MOT booking availability diagnostic"})
              try:
                  with urllib.request.urlopen(req,timeout=20) as response:
                      data=response.read(100_000).decode("utf-8","replace")
                      parser=Title();parser.feed(data)
                      print("STATUS:",response.status,"FINAL_URL:",response.url,"TITLE:",parser.title[:150])
                      print("BLOCKED:",any(x in data.lower() for x in ("request rejected","access denied","your support id","captcha")))
                      print("BODY_HEAD:",data[:150].replace("\\n"," "))
              except urllib.error.HTTPError as exc:
                  print("HTTP_ERROR:",exc.code,exc.reason)
                  print("BODY_HEAD:",exc.read(500).decode("utf-8","replace")[:200])
              except Exception as exc:
                  print("ERROR:",type(exc).__name__,str(exc)[:240])
          PY
