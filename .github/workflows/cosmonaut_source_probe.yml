name: Cosmonaut source probe

on:
  push:
    paths:
      - ".github/workflows/cosmonaut_source_probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List Internet Archive Cosmonaut items
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          q = urllib.parse.quote("collection:thecosmonaut")
          url = "https://archive.org/advancedsearch.php?q="+q+"&fl[]=identifier&fl[]=title&fl[]=mediatype&rows=500&page=1&output=json"
          with urllib.request.urlopen(url, timeout=60) as r:
              data = json.load(r)
          docs = data.get("response",{}).get("docs",[])
          print("COUNT", len(docs))
          for d in docs:
              print(d.get("identifier",""), "\t", d.get("title",""), "\t", d.get("mediatype",""))
          PY
