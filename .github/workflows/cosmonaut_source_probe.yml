name: Cosmonaut source probe

on:
  push:
    paths:
      - ".github/workflows/cosmonaut_source_probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Internet Archive collection
        run: |
          python - <<'PY'
          import json, urllib.request
          url = "https://archive.org/metadata/thecosmonaut"
          with urllib.request.urlopen(url, timeout=60) as r:
              data = json.load(r)
          files = data.get("files", [])
          wanted = []
          for f in files:
              name = f.get("name", "")
              low = name.lower()
              if low.endswith((".mp4",".mov",".mkv",".webm",".srt",".vtt",".txt",".pdf")):
                  wanted.append((name, f.get("size",""), f.get("format","")))
          for row in wanted[:1000]:
              print("\t".join(map(str,row)))
          PY
