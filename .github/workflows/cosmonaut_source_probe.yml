name: Cosmonaut source probe

on:
  push:
    paths:
      - ".github/workflows/cosmonaut_source_probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect candidate Cosmonaut clips
        run: |
          python - <<'PY'
          import json, urllib.request
          ids = [
            "thecosmonaut-tmthemessages001",
            "thecosmonaut-tmradiohooliganss001",
            "thecosmonaut-tmsmallaccidents001",
            "thecosmonaut-tmspacechesss001",
            "thecosmonaut-tmtherituals003",
            "thecosmonaut-s045"
          ]
          for ident in ids:
              print("\n###", ident)
              with urllib.request.urlopen("https://archive.org/metadata/"+ident, timeout=60) as r:
                  data=json.load(r)
              md=data.get("metadata",{})
              print("TITLE", md.get("title"))
              print("DESC", str(md.get("description",""))[:1500].replace("\n"," "))
              for f in data.get("files",[]):
                  name=f.get("name","")
                  low=name.lower()
                  if low.endswith((".mp4",".webm",".mov",".mkv",".srt",".vtt",".txt")):
                      print("FILE", name, "SIZE", f.get("size",""), "FORMAT", f.get("format",""), "LENGTH", f.get("length",""))
          PY
