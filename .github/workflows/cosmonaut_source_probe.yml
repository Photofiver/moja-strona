name: Cosmonaut source probe

on:
  push:
    paths:
      - ".github/workflows/cosmonaut_source_probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect S125 files
        run: |
          python - <<'PY'
          import json, urllib.request
          ident="thecosmonaut-s125"
          with urllib.request.urlopen("https://archive.org/metadata/"+ident,timeout=60) as r:
              data=json.load(r)
          print("TITLE",data.get("metadata",{}).get("title"))
          for f in data.get("files",[]):
              name=f.get("name","")
              if name.lower().endswith((".mp4",".mov",".wav",".xml",".txt")):
                  print(name,"|",f.get("size",""),"|",f.get("format",""),"|",f.get("length",""))
          PY
