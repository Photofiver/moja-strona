name: Cosmonaut contextual BEEP

on:
  push:
    paths:
      - ".github/workflows/cosmonaut_contextual_beep.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download source
        run: |
          curl -L --fail --retry 3             "https://archive.org/download/thecosmonaut-s125/01106_BO6J1609.mp4"             -o source.mp4

      - name: Build contextual edit
        run: |
          ffmpeg -y -ss 140.9 -t 2.9 -i source.mp4             -vf "scale=720:-2" -af "aresample=44100"             -c:v libx264 -preset veryfast -crf 22 -pix_fmt yuv420p -c:a aac -b:a 160k a.mp4

          ffmpeg -y -ss 150.0 -t 8.0 -i source.mp4             -f lavfi -t 8.0 -i "sine=frequency=1000:sample_rate=44100"             -filter_complex "[0:v]scale=720:-2[v];[0:a]aresample=44100,volume='if(between(t,3.20,3.78),0,1)':eval=frame[a0];[1:a]volume='if(between(t,3.20,3.78),0.55,0)':eval=frame[beep];[a0][beep]amix=inputs=2:duration=first:normalize=0[a]"             -map "[v]" -map "[a]"             -c:v libx264 -preset veryfast -crf 22 -pix_fmt yuv420p             -c:a aac -b:a 160k b.mp4

          ffmpeg -y -ss 163.8 -t 4.8 -i source.mp4             -f lavfi -t 4.8 -i "sine=frequency=1000:sample_rate=44100"             -filter_complex "[0:v]scale=720:-2[v];[0:a]aresample=44100,volume='if(between(t,0.84,1.32),0,1)':eval=frame[a0];[1:a]volume='if(between(t,0.84,1.32),0.55,0)':eval=frame[beep];[a0][beep]amix=inputs=2:duration=first:normalize=0[a]"             -map "[v]" -map "[a]"             -c:v libx264 -preset veryfast -crf 22 -pix_fmt yuv420p             -c:a aac -b:a 160k c.mp4

          printf "file 'a.mp4'\nfile 'b.mp4'\nfile 'c.mp4'\n" > clips.txt
          ffmpeg -y -f concat -safe 0 -i clips.txt -c copy joined.mp4

          ffmpeg -y -i joined.mp4             -filter_complex "[0:v]split=2[bg][fg];[bg]scale=720:1280:force_original_aspect_ratio=increase,crop=720:1280,boxblur=14:2[bg2];[fg]scale=720:-2[fg2];[bg2][fg2]overlay=(W-w)/2:(H-h)/2,drawtext=text='WHEN SHE SAYS TRUST ME...':fontcolor=white:fontsize=38:x=(w-text_w)/2:y=75:box=1:boxcolor=black@0.58:boxborderw=16,drawtext=text='The Cosmonaut raw footage - CC BY-SA-NC 3.0 - edited':fontcolor=white:fontsize=20:x=(w-text_w)/2:y=h-48:box=1:boxcolor=black@0.48:boxborderw=8,fps=30[v]"             -map "[v]" -map 0:a             -c:v libx264 -preset medium -crf 21 -pix_fmt yuv420p             -c:a aac -b:a 160k -movflags +faststart             cosmonaut_contextual_beep.mp4

      - name: Upload finished MP4
        uses: actions/upload-artifact@v4
        with:
          name: cosmonaut-contextual-beep
          path: cosmonaut_contextual_beep.mp4
          retention-days: 7
