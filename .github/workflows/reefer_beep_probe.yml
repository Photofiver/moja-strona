name: Reefer Madness BEEP probe

on:
  push:
    paths:
      - ".github/workflows/reefer_beep_probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install 'av==16.0.1' faster-whisper

      - name: Extract and transcribe target exchange
        run: |
          ffmpeg -y -ss 00:08:20             -i "https://archive.org/download/reefer_madness1938/reefer_madness1938_512kb.mp4"             -t 16 -c:v libx264 -preset ultrafast -crf 27 -c:a aac -b:a 96k scene.mp4
          python - <<'PY'
          from faster_whisper import WhisperModel
          model=WhisperModel("small.en",device="cpu",compute_type="int8")
          segs,_=model.transcribe("scene.mp4",beam_size=5,vad_filter=True,word_timestamps=True,language="en")
          for s in segs:
              print(f"SEG {s.start:.2f}-{s.end:.2f}: {s.text}",flush=True)
              if s.words:
                  for w in s.words:
                      print(f"WORD {w.start:.2f}-{w.end:.2f} {w.word}",flush=True)
          PY
