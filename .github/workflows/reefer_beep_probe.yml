name: Reefer Madness BEEP probe

on:
  push:
    paths:
      - ".github/workflows/reefer_beep_probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Find target subtitle lines
        run: |
          python - <<'PY'
          import urllib.request,re
          url="https://archive.org/download/reefer_madness1938/reefer_madness1938.asr.srt"
          txt=urllib.request.urlopen(url,timeout=30).read().decode("utf-8","replace")
          blocks=re.split(r"\n\s*\n",txt)
          keys=["reef","creep","racket","lips","hang him","what do you want","stop it","squawk"]
          for b in blocks:
              lb=b.lower()
              if any(k in lb for k in keys):
                  print("\n---\n"+b,flush=True)
          PY
