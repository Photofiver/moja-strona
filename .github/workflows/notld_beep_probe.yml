name: NOTLD BEEP probe

on:
  push:
    paths:
      - ".github/workflows/notld_beep_probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install 'av==16.0.1' faster-whisper

      - name: Extract famous scene from public-domain source
        run: |
          ffmpeg -y -ss 00:06:08 -i "https://archive.org/download/night-of-the-living-dead-1968_202401/Night%20of%20the%20Living%20Dead%20%281968%29.webm" -t 18 -c:v libx264 -preset veryfast -crf 24 -c:a aac -b:a 128k scene.mp4

      - name: Transcribe words
        run: |
          python - <<'PY'
          from faster_whisper import WhisperModel
          model=WhisperModel("small.en",device="cpu",compute_type="int8")
          segs,_=model.transcribe("scene.mp4",beam_size=5,vad_filter=True,word_timestamps=True,language="en")
          for s in segs:
              print(f"SEG {s.start:.2f}-{s.end:.2f}: {s.text}",flush=True)
              if s.words:
                  for w in s.words:
                      print(f"WORD {w.start:.2f}-{w.end:.2f} {w.word}",flush=True)
          PY
