name: TikTok BEEP demo

on:
  push:
    paths:
      - ".github/workflows/tiktok_beep_demo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download licensed source clip
        run: |
          curl -L --fail --retry 3             https://raw.githubusercontent.com/andreasbotsikas/DemoVideos/master/tears_of_steel.mp4             -o tears_of_steel.mp4

      - name: Create TikTok BEEP edit
        run: |
          ffmpeg -y -ss 24.0 -t 12.5 -i tears_of_steel.mp4             -f lavfi -t 12.5 -i "sine=frequency=1000:sample_rate=48000"             -filter_complex "[0:v]split=2[bg][fg];[bg]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,boxblur=18:2[bg2];[fg]scale=1080:-2[fg2];[bg2][fg2]overlay=(W-w)/2:(H-h)/2,drawtext=text='Tears of Steel - Blender Foundation | CC BY 3.0 | edited':fontcolor=white:fontsize=28:x=(w-text_w)/2:y=h-70:box=1:boxcolor=black@0.45:boxborderw=12[v];[0:a]volume=enable='between(t,8.55,9.65)':volume=0[a0];[1:a]atrim=start=0:end=1.10,volume=0.45,adelay=8550|8550[beep];[a0][beep]amix=inputs=2:duration=first:dropout_transition=0[a]"             -map "[v]" -map "[a]"             -c:v libx264 -preset medium -crf 21 -pix_fmt yuv420p             -c:a aac -b:a 192k -movflags +faststart             tiktok_tears_of_steel_beep.mp4

      - name: Upload finished MP4
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-tears-of-steel-beep
          path: tiktok_tears_of_steel_beep.mp4
          retention-days: 7
