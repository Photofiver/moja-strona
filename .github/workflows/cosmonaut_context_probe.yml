name: Cosmonaut context probe

on:
  push:
    paths:
      - ".github/workflows/cosmonaut_context_probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install 'av==16.0.1' faster-whisper

      - name: Download and isolate dialogue
        run: |
          curl -L --fail --retry 3             "https://archive.org/download/thecosmonaut-s125/01106_BO6J1609.mp4"             -o source.mp4
          ffmpeg -y -ss 140 -t 30 -i source.mp4 -vn -af "volume=4,highpass=f=100,lowpass=f=7000" -ar 16000 -ac 1 segment.wav

      - name: Transcribe exact words
        run: |
          python - <<'PY'
          from faster_whisper import WhisperModel
          model=WhisperModel("medium.en", device="cpu", compute_type="int8")
          segs, info=model.transcribe("segment.wav", beam_size=5, vad_filter=False, word_timestamps=True, language="en", condition_on_previous_text=False)
          for s in segs:
              print(f"SEG {140+s.start:.2f}-{140+s.end:.2f}: {s.text}", flush=True)
              if s.words:
                  for w in s.words:
                      print(f"WORD {140+w.start:.2f}-{140+w.end:.2f} {w.word}", flush=True)
          PY
